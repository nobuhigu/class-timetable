<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f8cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="時間割">
  <title>時間割</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>時間割</h1>
    <div class="toolbar">
      <select id="termSelect" title="学期"></select>
      <button id="tasksBtn">課題<span id="tasksCount" class="count"></span></button>
      <button id="addTermBtn" title="学期を追加">＋学期</button>
      <button id="settingsBtn">設定</button>
    </div>
  </header>

  <section id="now" class="now"></section>

  <main>
    <table id="timetable"></table>
  </main>

  <!-- 授業編集ダイアログ -->
  <dialog id="classDialog">
    <form method="dialog" id="classForm">
      <div class="dialog-head">
        <h2 id="classDialogTitle"></h2>
        <span id="classDialogZoom"></span>
      </div>
      <div class="tabs">
        <button type="button" data-tab="info">基本情報</button>
        <button type="button" data-tab="tasks">課題<span id="taskTabCount" class="count"></span></button>
        <button type="button" data-tab="attend">出欠</button>
      </div>

      <section data-panel="info">
        <label>授業名<input name="courseName" required></label>
        <label>教員<input name="teacher"></label>
        <label>教室<input name="room"></label>
        <label>授業時間
          <select name="timeMode" class="block-select"></select>
        </label>
        <div id="customTime" class="time-range" hidden>
          <input name="startTime" type="time"> 〜 <input name="endTime" type="time">
        </div>
        <label>Zoom URL<input name="zoomUrl" inputmode="url" autocomplete="off" placeholder="https://zoom.us/j/..."></label>
        <label>色<input name="color" type="color" value="#4f8cff"></label>
        <label>メモ（持ち物・連絡事項など）<textarea name="memo" rows="3"></textarea></label>
      </section>

      <section data-panel="tasks" hidden>
        <div class="task-add">
          <input id="taskTitle" placeholder="課題名（例：レポート第3回）" autocomplete="off">
          <input id="taskDue" type="datetime-local" title="締め切り">
          <button type="button" id="addTaskBtn" class="primary">追加</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </section>

      <section data-panel="attend" hidden>
        <div id="attendSummary" class="attend-summary"></div>
        <div class="attend-add">
          <input id="attendDate" type="date">
          <div class="status-buttons" id="attendButtons"></div>
        </div>
        <ul id="attendList" class="attend-list"></ul>
      </section>

      <div class="actions">
        <button type="button" id="deleteClassBtn" class="danger">削除</button>
        <span class="spacer"></span>
        <button type="button" data-close>キャンセル</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 課題一覧ダイアログ -->
  <dialog id="tasksDialog">
    <form method="dialog">
      <h2>課題一覧</h2>
      <label class="inline"><input type="checkbox" id="showDoneTasks">完了済みも表示</label>
      <ul id="allTaskList" class="task-list"></ul>
      <div class="actions">
        <span class="spacer"></span>
        <button class="primary">閉じる</button>
      </div>
    </form>
  </dialog>

  <!-- 設定ダイアログ -->
  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>設定</h2>
      <label>学期名<input name="termName" required></label>
      <fieldset>
        <legend>表示する曜日</legend>
        <div id="dayChecks" class="day-checks"></div>
      </fieldset>
      <fieldset>
        <legend>時限と時間</legend>
        <select id="presetSelect" class="preset-select" title="時間のプリセット">
          <option value="">プリセットから設定…</option>
        </select>
        <div id="periodRows"></div>
        <button type="button" id="addPeriodBtn">＋時限を追加</button>
      </fieldset>
      <fieldset>
        <legend>データ（バックアップ・端末間の移動）</legend>
        <div class="data-buttons">
          <button type="button" id="exportBtn">書き出し</button>
          <label class="button">読み込み<input type="file" id="importInput" accept="application/json" hidden></label>
        </div>
      </fieldset>
      <div class="actions">
        <button type="button" id="deleteTermBtn" class="danger">この学期を削除</button>
        <span class="spacer"></span>
        <button type="button" data-close>キャンセル</button>
        <button value="save" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
